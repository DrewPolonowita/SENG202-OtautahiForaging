plugins {
    id 'application'
    id 'java'
    id "org.openjfx.javafxplugin" version "0.1.0"
    id 'jacoco'
}

base {
    archivesName = 'seng202_team4'
}

group = 'seng202.team4'
version = '1.0-SNAPSHOT'

def mainClassName = 'seng202.team4.App'

def javaVersion = '25'
def javafxVersion = '25.0.3'
def log4jVersion = '2.26.1'
def cucumberVersion = '7.34.4'
def junitVersion = '6.0.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}


repositories {
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/org.openjfx/javafx-controls
    implementation "org.openjfx:javafx-controls:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.openjfx/javafx-fxml
    implementation "org.openjfx:javafx-fxml:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.openjfx/javafx-web
    implementation "org.openjfx:javafx-web:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
    implementation 'org.xerial:sqlite-jdbc:3.53.2.0'

    // https://mvnrepository.com/artifact/com.opencsv/opencsv
    implementation 'com.opencsv:opencsv:5.12.0'

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // https://mvnrepository.com/artifact/io.github.cdimascio/java-dotenv
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-junit-platform-engine
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-java
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-junit
    testImplementation "io.cucumber:cucumber-junit:${cucumberVersion}"

    // https://mvnrepository.com/artifact/org.junit.platform/junit-platform-suite
    testImplementation 'org.junit.platform:junit-platform-suite:1.8.2'

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"

    // https://mvnrepository.com/artifact/org.assertj/assertj-core
    testImplementation 'org.assertj:assertj-core:3.27.7'

    // https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation 'org.mockito:mockito-core:5.4.0'

    // https://central.sonatype.com/artifact/com.fasterxml.jackson.core/jackson-databind
    // Used for parsing strings into JSON Objects
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    // https://central.sonatype.com/artifact/io.github.cdimascio/dotenv-java
    // Used for environment variables
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // Used for converting between Lat/Long to NZTM Easting/Northing coordinates
    implementation 'org.locationtech.proj4j:proj4j:1.3.0'
}

application {
    // Define the main class for the application.
    mainClass = mainClassName
}

javafx {
    version = "${javafxVersion}"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web' ]
}

run {
    jvmArgs = ['--module-path', classpath.asPath, '--add-exports', 'javafx.web/com.sun.javafx.webkit=ALL-UNNAMED']
}

test {
    useJUnitPlatform()

    filter {
        includeTestsMatching "seng202.team4.unittests.*"
    }

    finalizedBy jacocoTestReport
}


tasks.register("cucumber", Test)  {
    group = "verification"

    useJUnitPlatform()

    filter {
        includeTestsMatching "seng202.team4.cucumber.*"
    }

    testLogging {
        events "failed"
        exceptionFormat "full"
    }

    finalizedBy jacocoTestReport
}

tasks.named("check") {
    dependsOn test, cucumber

    finalizedBy jacocoTestReport
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': mainClassName
    }
    from {
        configurations.runtimeClasspath.collect {it.isDirectory()?it:zipTree(it)}
    }
}

// Jacoco test coverage config
jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    // Build a lazy FileTree under the build directory
    def execTrees = layout.buildDirectory
            .dir("jacoco")
            .map { dir ->
                dir.asFileTree.matching {
                    include("**/*.exec")
                }
            }

    // Provide the FileTree lazily to the executionData property
    executionData.setFrom(execTrees)

    reports {
        html.outputLocation = layout.buildDirectory.dir("reports/tests/coverage")
    }

}
