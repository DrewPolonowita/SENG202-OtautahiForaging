<!DOCTYPE html>
<html>
<head>
    <title>Foraging Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/map.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <style>
        .tree-popup .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-popup .leaflet-popup-content {
            margin: 0;
            width: 180px !important;
        }
        .tree-popup .leaflet-popup-close-button {
            color: var(--primary-color) !important;
        }
        .tree-popup .leaflet-popup-close-button:hover {
            color: var(--primary-color-highlight) !important;
        }
        .tree-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            color: var(--text-color);
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-card-body {
            background: var(--primary-bg-color);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .serving-select {
            background-color: var(--primary-color) !important;
            color: var(--primary-bg-color);

            border: none;
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }

        .nutrition-heading {
            width: 100%;
            margin-top: 10px;
            color: var(--primary-color);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .nutrition-info {
            width: 100%;
            margin: 8px 0;
            font-size: 12px;
        }

        .nutrition-info > div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 3px 0;
        }

        .nutrition-info > div > span:last-child {
            font-weight: 600;
            white-space: nowrap;
        }

        .tree-card-body b {
            color: var(--primary-color);
        }
        .journal-btn {
            background: var(--primary-color);
            color: var(--primary-bg-color);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }
        .journal-btn:hover {
            background: var(--primary-color-highlight);
        }
        .journal-btn:active {
            background: var(--primary-color-dark);
        }
        .recipe-btn {
            background: var(--primary-color);
            color: var(--primary-bg-color);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }
        .recipe-btn:hover {
            background: var(--primary-color-highlight);
        }
        .recipe-btn:active {
            background: var(--primary-color-dark);
        }

    /* --------------  Marker Clusters -------------- */

        .marker-cluster-apple {
            background-color: #D31804;
        }

       .marker-cluster-apple div {
            background-color: #FF7787;
        }

        .marker-cluster-pear {
            background-color: #708E6E;
        }

        .marker-cluster-pear div {
            background-color: #86CA82;
        }

        .marker-cluster-peach {
            background-color: #CA9582;
        }

        .marker-cluster-peach div {
            background-color: #DE834F;
        }

        .marker-cluster-apricot {
            background-color: #8C663E;
        }

        .marker-cluster-apricot div {
            background-color: #F2B36D;
        }

        .marker-cluster-walnut {
            background-color: #825845;
        }

        .marker-cluster-walnut div {
            background-color: #CE9777;
        }

        .marker-cluster-strawberry {
            background-color: #A64C5C;
        }

        .marker-cluster-strawberry div {
            background-color: #AF5070;
        }

        .marker-cluster {
            background-clip: padding-box;
            border-radius: 20px;
            border: 1px solid white;
        }

        .marker-cluster div {
            width: 30px;
            height: 30px;
            margin-left: 5px;
            margin-top: 5px;
            text-align: center;
            border-radius: 15px;
            font: 12px "Helvetica Neue", Arial, Helvetica, sans-serif;
            opacity: 60%;
        }

        .marker-cluster div:hover {
            opacity: 100%;
        }

        .marker-cluster span {
	        line-height: 30px;
	    }
        /*

        .marker-cluster-small {
            scale: 90%;
        }

       .marker-cluster-medium {
            scale: 100%;
        }

       .marker-cluster-large {
           scale: 110%;
        }

    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
    const NORTH_BOUND = -43.40;
    const EAST_BOUND = 172.85;
    const SOUTH_BOUND = -43.70;
    const WEST_BOUND = 172.35;

    const MAX_ZOOM = 17;
    const MIN_ZOOM = 12;

    let map;
    let markers = [];
    let markersById = {};
    let markerClusterGroup;
    let revealingTree = false; // prevents marker refresh while revealing journal target's tree.
    let pendingTreeId = null; // specific tree from journal.
    var javaScriptBridge; // must be declared as var (will not be correctly assigned in java with let keyword)
    const iconCache = {};
    const clusterGroups = {};
    let foodCluster = null;
    var southWest = L.latLng(SOUTH_BOUND, WEST_BOUND),
        northEast = L.latLng(NORTH_BOUND, EAST_BOUND),
        bounds = L.latLngBounds(southWest, northEast);

    /**
     * This object can be returned to our java code, where we can call the functions we define inside of it
     */
    let jsConnector = {
        addMarker: addMarker,
        removeMarkers: removeMarkers,
        initMap: initMap,
        updateMarkerPopup: updateMarkerPopup,
        createClusterGroups: createClusterGroups
    };

    /**
     * Creates and initialises the map, tile layer, marker cluster group
     * Registers map movement handling and requests initial trees.
     *
     * @param lat latitude to centre the map on.
     * @param lon longitude to centre the map on.
     * @param zoom initial zoom level
     * @param treeId journal linked tree to reveal, or null.
     */
    function initMap(lat = -43.53, lon = 172.63, zoom = 13.5, treeId = null) {
        pendingTreeId = treeId;
        let mapOptions = {
            center: [lat, lon],
            zoom: zoom,
            maxZoom: MAX_ZOOM,
            minZoom: MIN_ZOOM
        }
        mapOptions.zoomControl = false;

        map = new L.map('map', mapOptions);
        L.control.zoom({position: "bottomleft" }).addTo(map);
        new L.TileLayer('https://tile.csse.canterbury.ac.nz/hot/{z}/{x}/{y}.png', { // UCs tilemap server
            attribution: '© OpenStreetMap contributors<br>Served by University of Canterbury',
            maxZoom: 19
        }).addTo(map)
        map.setMaxBounds(bounds);
        map.options.maxBoundsViscosity = 1.0;
        Object.values(clusterGroups).forEach((foodClusterGroup) =>  {
            map.addLayer(foodClusterGroup);
        });
        map.on('moveend', function () {
            if (!revealingTree) {
                createMapMarkers();
            }
        });

        createMapMarkers();
    }

    /**
     * Requests trees for the current map bounds through the Java bridge.
     * Java supplies the resulting markers through addMarker().
     */
    const createMapMarkers = () => {
        const bounds = map.getBounds();

        const north = bounds.getNorth();
        const east = bounds.getEast();
        const south = bounds.getSouth();
        const west = bounds.getWest();
        const center = map.getCenter();

        javaScriptBridge.mapMoved(north, east, south, west,
            center.lat, center.lng, map.getZoom());
    }

    /**
     * Returns the marker icon for a food.
     */
    function getIcon(food) {
        const fruitName = food.trim().toLowerCase().replace(/\s+/g, "");
        const pinFileName = fruitName + "Pin.png";

        if (!iconCache[pinFileName]) {
            iconCache[pinFileName] = new L.Icon({
                iconUrl: "../images/pins/" + pinFileName,
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [1, -34],
                tooltipAnchor: [16, -28],
                shadowSize: [0, 0]
            });
        }
        return iconCache[pinFileName];
    }

    /**
    * Creates cluster groups
    */
    function createClusterGroups(food) {
        foodCluster = food.toString();
        clusterGroups[food] = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                foodCluster = food.toString();
                let childCount = cluster.getChildCount();
                let clusterSize = 'medium';
                if (childCount < 5) {
                    clusterSize = 'small';
                } else if (clusterSize < 10) {
                    clusterSize = 'medium';
                } else {
                    clusterSize = 'large';
                }
                return L.divIcon({ html: '<div><span><b>' + childCount + '</b></span></div>',
                                   className: 'marker-cluster marker-cluster-'+ foodCluster.trim().toLowerCase().replace(/\s+/g, "") + ' marker-cluster-' + clusterSize,
                                   iconSize: L.point(40, 40)
                });
            }
        });
    }

    /**
     * Adds a marker to the cluster group and binds its popup.
     * If a tree matches the journal target, it reveals it and opens its popup.
     * @param id the tree's ID
     * @param html tooltip to display on hover
     * @param food name of the food used to select the marker icon
     * @param lat latitude to place marker at
     * @param lng longitude to place marker at
     */
    function addMarker(id, html, food, lat, lng) {
        const marker = new L.Marker([lat, lng], { icon: getIcon(food) });
        marker.nutritionLoaded = false;

        marker.bindPopup(html, { className: 'tree-popup', closeButton: true, autoPan: true, closeOnClick: false});

        marker.on("popupopen", function (event) {
            if (!marker.nutritionLoaded) {
                javaScriptBridge.loadTreeNutrition(id);
                return;
            }

            const select = event.popup.getElement().querySelector(".serving-select");
            if (select) {
                updateNutrition(select);
            }
        });

        clusterGroups[food].addLayer(marker);
        markers.push(marker);
        markersById[id] = marker;

        if (id == pendingTreeId && pendingTreeId != null) {
            pendingTreeId = null;
            revealingTree = true;
            clusterGroups[food].zoomToShowLayer(marker, function () {
                marker.openPopup();
                revealingTree = false;
            });
        }
    }

    /**
     * Removes all the tree markers from the cluster group and clears
     * the stored marker array
    */
    function removeMarkers() {
        Object.values(clusterGroups).forEach((clusterGroup) => {
            clusterGroup.clearLayers();
        });
        markers = [];
        markersById = {};
    }

    function updateNutrition(input) {
        const grams = input.value;

        const card = input.closest(".tree-card");
        const factor = grams/100.0;

        updateNutritionText(card, "calories", "Calories", "kcal", input.dataset.calories * factor, 0);
        updateNutritionText(card, "carbohydrates", "Carbohydrates", "g", input.dataset.carbohydrates * factor, 1);
        updateNutritionText(card, "protein", "Protein", "g", input.dataset.protein * factor, 1);
        updateNutritionText(card, "fat", "Fat", "g", input.dataset.fat * factor, 1);
    }

    function updateNutritionText(card, className, label, unit, value, decimals) {
        card.querySelector("." + className).textContent =
            label + ": " + formatNutrition(value, decimals) + " " + unit;
    }

    function formatNutrition(value, decimals) {
        const number = Number(value);
        return number.toFixed(decimals);
    }

    function updateMarkerPopup(id, html) {
        const marker = markersById[id];

        if (!marker) {
            return;
        }

        marker.nutritionLoaded = true;
        marker.setPopupContent(html);

        if (marker.isPopupOpen()) {
            const popup = marker.getPopup();
            const select = popup.getElement().querySelector(".serving-select");

            if (select) {
                updateNutrition(select);
            }
        }
    }

</script>
</body>
</html>
