<!DOCTYPE html>
<html>
<head>
    <title>Foraging Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/map.css" />
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <style>
        .tree-popup .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-popup .leaflet-popup-content {
            margin: 0;
            width: 150px !important;
        }
        .tree-popup .leaflet-popup-close-button {
            color: white !important;
        }
        .tree-popup .leaflet-popup-close-button:hover {
            color: #cccccc !important;
        }
        .tree-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            color: white;
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-card-body {
            background: #1a2e21;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .serving-select {
            background-color: #3f6b4a;
            color: white;

            border: none;
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }

        .nutrition-info {
            width: 100%;
            margin-top: 8px;
            font-size: 0.85em;
            text-align: left;
        }

        .nutrition-info div {
            margin: 2px 0;
        }

        .journal-btn {
            background: #3f6b4a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }
        .journal-btn:hover {
            background: #4a7c59;
        }
        .journal-btn:active {
            background: #345940;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script>
    let map;
    let markers = [];
    var javaScriptBridge; // must be declared as var (will not be correctly assigned in java with let keyword)
    const iconCache = {};
    /**
     * This object can be returned to our java code, where we can call the functions we define inside of it
     */
    let jsConnector = {
        addMarker: addMarker,
        removeMarkers: removeMarkers,
        displayMarkers: displayMarkers,
        initMap: initMap
    };

    /**
     * Creates and initialises the Leaflet map, and registers map movement handling.
     * If a target tree ID is provided, its popup opens when its marker loads.
     */
    function initMap(lat = -43.53, lon = 172.63, zoom = 13.5, treeId = null) {
        pendingTreeId = treeId;
        let mapOptions = {
            center: [lat, lon],
            zoom: zoom,
        }
        mapOptions.zoomControl = false;

        map = new L.map('map', mapOptions);
        L.control.zoom({position: "bottomleft" }).addTo(map);
        new L.TileLayer('https://tile.csse.canterbury.ac.nz/hot/{z}/{x}/{y}.png', { // UCs tilemap server
            attribution: '© OpenStreetMap contributors<br>Served by University of Canterbury'
        }).addTo(map)
        /**
         * Signals the JavaScriptBridge when the map is finished moving and updates the coordinates
         * for query purposes
         */
        map.on('moveend', function () {
            createMapMarkers();
        });

        createMapMarkers();

    }

    const createMapMarkers = () => {
        const bounds = map.getBounds();

        const north = bounds.getNorth();
        const east = bounds.getEast();
        const south = bounds.getSouth();
        const west = bounds.getWest();

        javaScriptBridge.mapMoved(north, east, south, west);
    }

    function getIcon(food) {
        const fruitName = food.trim().toLowerCase().replace(/\s+/g, "");
        const pinFileName = fruitName + "Pin.png";

        if (!iconCache[pinFileName]) {
            iconCache[pinFileName] = new L.Icon({
                iconUrl: "../images/pins/" + pinFileName,
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [1, -34],
                tooltipAnchor: [16, -28],
                shadowSize: [0, 0]
            });
        }
        return iconCache[pinFileName];
    }
    /**
     * Adds a marker to the map and stores it in the markers array for later use (e.g. removal)
     * @param html tooltip to display on hover
     * @param food type of food in enum
     * @param lat latitude to place marker at
     * @param lng longitude to place marker at
     */
    function addMarker(id, html, food, lat, lng) {
        const marker = new L.Marker([lat, lng], { icon: getIcon(food) });

        marker.bindPopup(html, { className: 'tree-popup', closeButton: true });
        marker.addTo(map).on('click', e => javaScriptBridge.getTreeFromClick(id));

        markers.push(marker);

        if (id == pendingTreeId) {
            pendingTreeId = null;
            marker.openPopup();
        }
    }

    function removeMarkers() {
        markers.forEach(m => m.remove())
        markers = [];
    }

    function displayMarkers() {
        markers.forEach(m => m.addTo(map))
    }

    function updateNutrition(select) {
        const selected = select.selectedOptions[0];
        const card = select.closest(".tree-card");

        updateNutritionText(card, "calories", "Calories", "kcal", selected.dataset.calories);
        updateNutritionText(card, "carbohydrates", "Carbohydrates", "g", selected.dataset.carbohydrates);
        updateNutritionText(card, "protein", "Protein", "g", selected.dataset.protein);
        updateNutritionText(card, "fat", "Fat", "g", selected.dataset.fat);
    }

    function updateNutritionText(card, className, label, unit, value) {
        card.querySelector("." + className).textContent = label + ": " + value + " " + unit;
    }

</script>
</body>
</html>
