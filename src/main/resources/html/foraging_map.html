<!DOCTYPE html>
<html>
<head>
    <title>Foraging Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/map.css" />
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <style>
        .tree-popup .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-popup .leaflet-popup-content {
            margin: 0;
            width: 150px !important;
        }
        .tree-popup .leaflet-popup-close-button {
            color: white !important;
        }
        .tree-popup .leaflet-popup-close-button:hover {
            color: #cccccc !important;
        }
        .tree-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            color: white;
            border-radius: 16px;
            overflow: hidden;
        }
        .tree-card-image {
            height: 90px;
            background: linear-gradient(135deg, #4a7c59, #2d5a3d);
            background-size: cover;
            background-position: center;
        }
        .tree-card-body {
            background: #1a2e21;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .journal-btn {
            background: #3f6b4a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }
        .journal-btn:hover {
            background: #4a7c59;
        }
        .journal-btn:active {
            background: #345940;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
<script>
    let map;
    let markers = [];
    var javaScriptBridge; // must be declared as var (will not be correctly assigned in java with let keyword)

    /**
     * This object can be returned to our java code, where we can call the functions we define inside of it
     */
    let jsConnector = {
        addMarker: addMarker,
        removeMarkers: removeMarkers,
        displayMarkers: displayMarkers,
        initMap: initMap
    };

    /**
     * creates and initialises the Leaflet map, also defines on click event that calls java code
     */
    function initMap() {
        let mapOptions = {
            center: [-43.53, 172.63],
            zoom: 13
        }
        map = new L.map('map', mapOptions);
        new L.TileLayer('https://tile.csse.canterbury.ac.nz/hot/{z}/{x}/{y}.png', { // UCs tilemap server
            attribution: '© OpenStreetMap contributors<br>Served by University of Canterbury'
        }).addTo(map)
        /**
         * Signals the JavaScriptBridge when the map is finished moving and updates the coordinates
         * for query purposes
         */
        map.on('moveend', function () {
            createMapMarkers();
        });

        createMapMarkers();

    }

    const createMapMarkers = () => {
        const bounds = map.getBounds();

        const north = bounds.getNorth();
        const east = bounds.getEast();
        const south = bounds.getSouth();
        const west = bounds.getWest();

        javaScriptBridge.mapMoved(north, east, south, west);
    }


    /**
     * Adds a marker to the map and stores it in the markers array for later use (e.g. removal)
     * @param title tooltip to display on hover
     * @param lat latitude to place marker at
     * @param lng longitude to place marker at
     */
    function addMarker(id, title, lat, lng) {
        let m = new L.Marker([lat, lng]);
        m.bindPopup(title, { className: 'tree-popup', closeButton: true });

        m.addTo(map).on('click', e => javaScriptBridge.getTreeFromClick(id));
        markers.push(m);
    }

    function removeMarkers() {
        markers.forEach(m => m.remove())
    }

    function displayMarkers() {
        markers.forEach(m => m.addTo(map))
    }

</script>
</body>
</html>
